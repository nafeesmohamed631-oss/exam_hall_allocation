{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block body_class %}bg-admin-login{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <div class="auth-card">
    <div class="auth-icon-header">
      <i class="fa-solid fa-user-shield"></i>
    </div>
    <h1>Admin Portal</h1>
    <p>Sign in to manage halls, exams, and seating arrangements</p>

    <form method="post" class="stack">
      <div style="text-align: left;">
        <label for="username"><i class="fa-solid fa-user" style="margin-right: 4px; color: var(--primary);"></i> Username</label>
        <input id="username" name="username" placeholder="Enter admin username" required autofocus autocomplete="username">
      </div>

      <div style="text-align: left;">
        <label for="password"><i class="fa-solid fa-lock" style="margin-right: 4px; color: var(--primary);"></i> Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn" style="width: 100%; margin-top: 0.75rem; padding: 0.85rem;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.88rem;">
      <span class="muted">Looking for student seating?</span>
      <a href="{{ url_for('index') }}" style="font-weight: 600; margin-left: 0.25rem;">
        <i class="fa-solid fa-magnifying-glass"></i> Find My Seat
      </a>
    </div>
  </div>
</div>
{% endblock %}
