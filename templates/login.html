{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-header">
    <div class="brand-icon" style="margin: 0 auto 0.5rem auto; width: 44px; height: 44px; font-size: 1.25rem;">
      <i class="fa-solid fa-user-shield"></i>
    </div>
    <h1>Admin Login</h1>
    <p class="muted small-text">Enter your credentials to access the management portal</p>
  </div>

  <form method="post" class="stack">
    <div>
      <label for="username">Username</label>
      <input id="username" name="username" placeholder="admin" required autofocus autocomplete="username">
    </div>

    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">
      <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
    </button>
  </form>

  <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); text-align: center; font-size: 0.85rem;">
    <span class="muted">Are you a student?</span>
    <a href="{{ url_for('index') }}" style="font-weight: 600; margin-left: 0.25rem;">
      <i class="fa-solid fa-magnifying-glass"></i> Find Your Seat
    </a>
  </div>
</div>
{% endblock %}
