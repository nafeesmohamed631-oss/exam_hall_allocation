<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Exam Seating System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <a class="brand" href="{{ url_for('index') }}">🎓 ExamSeat</a>
  <nav>
    {% if session.admin %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('students_page') }}">Students</a>
      <a href="{{ url_for('exams_page') }}">Exams</a>
      <a href="{{ url_for('halls_page') }}">Halls</a>
      <a href="{{ url_for('seatings_page') }}">Seatings</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
      <a href="{{ url_for('index') }}">Find my seat</a>
      <a href="{{ url_for('login') }}">Admin login</a>
    {% endif %}
  </nav>
</header>
<main class="container">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
