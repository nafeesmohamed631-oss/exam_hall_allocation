{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <div class="card narrow center" style="padding: 3rem 2rem;">
    <div style="font-size: 4rem; color: var(--error); margin-bottom: 1rem; line-height: 1;">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 style="justify-content: center; font-size: 2.5rem; margin-bottom: 0.5rem;">{{ code }}</h1>
    <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 1.75rem;">{{ message }}</p>
    <div>
      <a class="btn" href="{{ url_for('index') }}">
        <i class="fa-solid fa-house"></i> Return to Homepage
      </a>
      {% if session.admin %}
        <a class="btn secondary" href="{{ url_for('dashboard') }}" style="margin-left: 0.5rem;">
          <i class="fa-solid fa-chart-pie"></i> Dashboard
        </a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
